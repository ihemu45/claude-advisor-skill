name: refresh deals

# Hourly research job. It fetches the deal feeds (and, with ANTHROPIC_API_KEY,
# runs the Claude research step), rewrites site/data/*.json and commits the
# result to the branch it ran on. Vercel is linked to this repository and
# redeploys the site on that push, so there is no deploy step here.

on:
  schedule:
    - cron: "7 * * * *"          # hourly at :07 UTC; off the hour so GitHub's top-of-hour queue does not delay it
  workflow_dispatch:
    inputs:
      research:
        description: "Run the Claude research step (needs the ANTHROPIC_API_KEY secret)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/refresh-deals.yml"

permissions:
  contents: write

concurrency:
  group: refresh-deals
  cancel-in-progress: false

jobs:
  refresh:
    name: fetch feeds, research, commit data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install agent dependencies
        run: pip install -r agent/requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s agent/tests -t .

      - name: Run the research agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          RESEARCH_EFFORT: ${{ vars.RESEARCH_EFFORT }}
          RESEARCH_PER_RUN: ${{ vars.RESEARCH_PER_RUN }}
          RESEARCH_HOT: ${{ vars.RESEARCH_HOT }}
          RESEARCH_MAX_SEARCHES: ${{ vars.RESEARCH_MAX_SEARCHES }}
          STALE_HOURS: ${{ vars.STALE_HOURS }}
          MAX_DEALS: ${{ vars.MAX_DEALS }}
          SKIP_RESEARCH: ${{ github.event_name == 'workflow_dispatch' && inputs.research == false }}
        run: |
          set -euo pipefail
          extra=""
          if [ "$SKIP_RESEARCH" = "true" ]; then extra="--no-research"; fi
          python -m agent --out site/data $extra
          echo "### dealgrep run" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("site/data/meta.json"))
          r = m.get("research") or {}
          print(f"- **{m['total']}** deals, **{m['new_this_run']}** new, {m['with_coupon']} with coupon, {m['black_friday']} tagged Black Friday")
          print(f"- sources ok: {sum(1 for s in m['sources'] if s['ok'])}/{sum(1 for s in m['sources'] if not s.get('skipped'))}")
          for s in m["sources"]:
              state = "ok" if s["ok"] else ("skipped: " + s["skipped"] if s.get("skipped") else "FAILED")
              print(f"  - {s['name']}: {state} ({s['count']} items) {s.get('error') or ''}")
          if r.get("enabled"):
              print(f"- research: {r.get('found')} deals from {', '.join(r.get('categories', []))} via {r.get('model')} — {r.get('input_tokens')} in / {r.get('output_tokens')} out tokens, {r.get('web_searches')} web searches")
              for e in r.get("errors", []):
                  print(f"  - error: {e}")
          else:
              print(f"- research: skipped ({r.get('skipped')})")
          PY

      - name: Commit refreshed data
        run: |
          set -euo pipefail
          git config user.name "dealgrep-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "no data changes to commit"
            exit 0
          fi
          git commit -m "data: refresh deals $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Another run or a human may have pushed meanwhile; replay on top and push.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "- committed refreshed data to \`$GITHUB_REF_NAME\`; Vercel redeploys from this push" >> "$GITHUB_STEP_SUMMARY"
