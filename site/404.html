<!doctype html>
<html lang="en" data-root="./">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · dealgrep</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0e14;color:#dbe2ec;font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
  .box{max-width:560px;padding:24px;border:1px solid #1f2a3a;border-radius:10px;background:#0e131b;line-height:1.7}
  .p{color:#39d98a}.c{color:#6f7d92}a{color:#6cb6ff}
</style>
</head>
<body>
<div class="box">
  <div><span class="p">~/dealgrep $</span> open <span id="path">this page</span></div>
  <div>bash: <span id="path2">page</span>: No such file or directory <span class="c"># 404</span></div>
  <div style="margin-top:12px">try <a id="home" href="/">home</a> or <a id="deals" href="/deals.html">browse deals</a>.</div>
</div>
<script>
  // Project sites live under /<repo>/; derive the base from the first path segment.
  var seg = location.pathname.split('/').filter(Boolean);
  var base = seg.length > 1 ? '/' + seg[0] + '/' : '/';
  document.getElementById('home').href = base; document.getElementById('deals').href = base + 'deals.html';
  document.getElementById('path').textContent = location.pathname; document.getElementById('path2').textContent = location.pathname;
</script>
</body>
</html>
